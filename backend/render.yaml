services:
  - type: web
    name: sakthi-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
      python manage.py seed_sakthi
      python manage.py fetch_brand_logos
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,sakthi-solutions.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://sakthi-solutions.vercel.app"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_NAME
        fromDatabase:
          name: sakthi-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: sakthi-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sakthi-db
          property: password
      - key: DATABASE_HOST
        fromDatabase:
          name: sakthi-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: sakthi-db
          property: port
      - key: PYTHON_VERSION
        value: "3.11"

databases:
  - name: sakthi-db
    plan: free
